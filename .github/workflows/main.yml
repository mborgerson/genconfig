name: main
on: ['push', 'pull_request']
jobs:
  main:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          pip install --user pyyaml tomli
          cd example
          make
          ./example
          ./check.py

  unit_tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        pip install pyyaml tomli meson ninja
    - name: Run Unit Tests
      run: |
        meson setup buildDir
        meson test -C buildDir --print-errorlogs
